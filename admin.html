<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIMLOCK 10 — Admin</title>
  <style>
    :root {
      --bg: #0a0305; --card: rgba(28,10,14,.92); --line: rgba(255,92,110,.2);
      --accent: #ff3b52; --accent-soft: #ff9aa5; --text: #fff4f5; --muted: #c4a8ad;
      --ok: #96ffd5; --warn: #ffd78f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, rgba(255,42,66,.18), transparent 50%), #050102;
      color: var(--text); padding: 16px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .1em; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .toolbar, .card {
      border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 14px; margin-bottom: 14px;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, select, button {
      font: inherit; color: inherit; border-radius: 10px; border: 1px solid var(--line);
      background: rgba(255,255,255,.04); padding: 10px 12px; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    button {
      cursor: pointer; background: linear-gradient(180deg, rgba(255,59,82,.4), rgba(148,12,31,.3));
      border-color: rgba(255,138,151,.35); font-weight: 700;
    }
    button.ghost { background: rgba(255,255,255,.04); }
    button.danger { background: rgba(180,20,40,.5); }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .stat { flex: 1; min-width: 100px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); text-align: center; }
    .stat b { display: block; font-size: 22px; color: var(--accent-soft); }
    .stat span { font-size: 11px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: top; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge.ok { background: rgba(32,112,68,.35); color: var(--ok); }
    .badge.off { background: rgba(120,40,50,.4); color: #ff8b98; }
    .form-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .form-row input, .form-row select { flex: 1; min-width: 90px; }
    .msg { margin-top: 8px; font-size: 13px; color: var(--warn); min-height: 1.2em; }
    .msg.ok { color: var(--ok); }
    code { background: rgba(0,0,0,.35); padding: 2px 6px; border-radius: 6px; font-size: 12px; word-break: break-all; }
    .devices { margin-top: 6px; padding: 8px; border-radius: 10px; background: rgba(0,0,0,.25); font-size: 12px; }
    .devices div { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .devices div:last-child { border-bottom: 0; }
    h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .12em; color: var(--accent-soft); text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>AIMLOCK MODE 10</h1>
  <p class="sub">Admin — Tạo key · Tìm key · Xem thiết bị</p>

  <div class="toolbar">
    <input id="tokenInput" type="password" placeholder="Admin Token" style="min-width:180px" />
    <button type="button" id="btnSaveToken">Lưu Token</button>
    <button type="button" class="ghost" id="btnRefresh">Làm mới</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>Tạo Key mới</h2>
    <div class="form-row">
      <input id="newCode" placeholder="Mã key (trống = tự gen)" />
      <select id="newPreset">
        <option value="day">1 ngày</option>
        <option value="week">1 tuần</option>
        <option value="month" selected>1 tháng</option>
        <option value="year">1 năm</option>
        <option value="perm">Vĩnh viễn</option>
        <option value="custom">Custom ngày</option>
      </select>
    </div>
    <div class="form-row">
      <input id="newDays" type="number" min="1" placeholder="Số ngày" style="display:none" />
      <input id="newMaxUses" type="number" min="0" placeholder="Max thiết bị (0=∞)" value="0" />
      <input id="newNote" placeholder="Ghi chú" />
    </div>
    <button type="button" id="btnCreate">Tạo Key</button>
    <div class="msg" id="createMsg"></div>
  </div>

  <div class="card">
    <h2>Tìm & danh sách Key</h2>
    <div class="form-row">
      <input id="searchQ" placeholder="Tìm theo mã key / ghi chú..." />
      <button type="button" class="ghost" id="btnSearch">Tìm</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Key</th>
            <th>Loại</th>
            <th>Thiết bị</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="keysBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = location.origin;
    const tokenInput = document.getElementById("tokenInput");
    const createMsg = document.getElementById("createMsg");
    const presetEl = document.getElementById("newPreset");
    const daysEl = document.getElementById("newDays");

    function getToken() {
      return localStorage.getItem("alm10_admin_token") || tokenInput.value.trim();
    }
    function headers() {
      return { "Content-Type": "application/json", "X-Admin-Token": getToken() };
    }
    tokenInput.value = localStorage.getItem("alm10_admin_token") || "";
    document.getElementById("btnSaveToken").onclick = () => {
      localStorage.setItem("alm10_admin_token", tokenInput.value.trim());
      refresh();
    };
    presetEl.onchange = () => {
      daysEl.style.display = presetEl.value === "custom" ? "block" : "none";
    };

    async function api(method, path, body) {
      const opt = { method, headers: headers() };
      if (body) opt.body = JSON.stringify(body);
      const r = await fetch(API + path, opt);
      return r.json();
    }

    function renderKeys(keys) {
      document.getElementById("keysBody").innerHTML = (keys || []).map(k => {
        const devicesHtml = (k.devices && k.devices.length)
          ? `<div class="devices">${k.devices.map(d =>
              `<div>
                <b>${d.device || "Device"}</b>
                <code style="font-size:10px">${(d.deviceId || "").slice(0,12)}…</code><br/>
                Vào: ${d.startText || "—"} · Online: ${d.lastSeenText || "—"} · ${d.remaining || ""}
                <button class="danger" style="padding:4px 8px;font-size:11px;margin-left:6px" onclick="kickDevice('${d.deviceId}')">Kick</button>
              </div>`
            ).join("")}</div>`
          : `<div class="devices" style="color:var(--muted)">Chưa có thiết bị nào</div>`;

        return `<tr>
          <td><code>${k.code}</code><br/><span style="color:var(--muted);font-size:11px">${k.note || ""}</span>
            ${devicesHtml}
          </td>
          <td>${k.label}${k.permanent ? "" : " (" + k.days + "d)"}<br/>
            <span style="color:var(--muted);font-size:11px">Max TB: ${k.maxUses || "∞"}</span>
          </td>
          <td><b style="color:var(--accent-soft)">${k.deviceCount || 0}</b>
            ${k.maxUses ? " / " + k.maxUses : ""}
          </td>
          <td><span class="badge ${k.active ? "ok" : "off"}">${k.active ? "ON" : "OFF"}</span></td>
          <td>
            <button class="ghost" onclick="toggleKey('${k.code}', ${!k.active})">${k.active ? "Tắt" : "Bật"}</button>
            <button class="danger" onclick="delKey('${k.code}')">Xóa</button>
          </td>
        </tr>`;
      }).join("") || "<tr><td colspan='5'>Không có key</td></tr>";
    }

    async function refresh() {
      try {
        const q = document.getElementById("searchQ").value.trim();
        const path = q ? "/api/admin/keys?q=" + encodeURIComponent(q) : "/api/admin/keys";
        const [st, keys] = await Promise.all([
          api("GET", "/api/admin/stats"),
          api("GET", path)
        ]);
        if (!st.ok) {
          document.getElementById("stats").innerHTML = `<div class="stat"><b>!</b><span>${st.error || "Sai token"}</span></div>`;
          return;
        }
        const s = st.stats;
        document.getElementById("stats").innerHTML = `
          <div class="stat"><b>${s.totalKeys}</b><span>TỔNG KEY</span></div>
          <div class="stat"><b>${s.activeKeys}</b><span>KEY ACTIVE</span></div>
          <div class="stat"><b>${s.validSessions}</b><span>THIẾT BỊ ONLINE</span></div>
          <div class="stat"><b>${s.totalSessions}</b><span>TỔNG SESSION</span></div>
        `;
        renderKeys(keys.keys || []);
      } catch (e) {
        document.getElementById("stats").innerHTML = `<div class="stat"><b>!</b><span>${e.message}</span></div>`;
      }
    }

    document.getElementById("btnCreate").onclick = async () => {
      createMsg.textContent = "";
      createMsg.className = "msg";
      const body = {
        code: document.getElementById("newCode").value.trim() || undefined,
        maxUses: Number(document.getElementById("newMaxUses").value) || 0,
        note: document.getElementById("newNote").value.trim()
      };
      if (presetEl.value === "custom") {
        body.days = Number(daysEl.value) || 1;
        body.permanent = false;
        body.label = body.days + " ngày";
      } else body.preset = presetEl.value;
      const r = await api("POST", "/api/admin/keys", body);
      if (r.ok) {
        createMsg.className = "msg ok";
        createMsg.textContent = "Đã tạo: " + r.key.code;
        document.getElementById("newCode").value = "";
        refresh();
      } else createMsg.textContent = r.error || "Lỗi";
    };

    document.getElementById("btnSearch").onclick = refresh;
    document.getElementById("searchQ").addEventListener("keydown", (e) => {
      if (e.key === "Enter") refresh();
    });
    document.getElementById("btnRefresh").onclick = () => {
      document.getElementById("searchQ").value = "";
      refresh();
    };

    window.toggleKey = async (code, active) => { await api("PUT", "/api/admin/keys/" + code, { active }); refresh(); };
    window.delKey = async (code) => {
      if (!confirm("Xóa key " + code + " và mọi thiết bị?")) return;
      await api("DELETE", "/api/admin/keys/" + code);
      refresh();
    };
    window.kickDevice = async (deviceId) => {
      if (!confirm("Kick thiết bị này?")) return;
      await api("DELETE", "/api/admin/devices/" + encodeURIComponent(deviceId));
      refresh();
    };

    refresh();
  </script>
</body>
</html>
